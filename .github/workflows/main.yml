name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --disable-sandbox

      - name: Validate installer
        run: bash -n install.sh

      - name: Build universal plugin
        run: ./build.sh

      - name: Verify architectures
        run: lipo -archs plugin/ExportHEIC.lrplugin/LRExportHEIC

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: ExportHEIC.lrplugin
          path: plugin/ExportHEIC.lrplugin
          if-no-files-found: error
